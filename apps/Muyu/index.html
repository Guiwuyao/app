<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>电子木鱼 | Toolbox</title>
    <!-- 引入霞鹜文楷 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css" />
    <!-- 引入全局样式 -->
    <link rel="stylesheet" href="../../assets/css/global.css">
    <!-- 引入专属样式 -->
    <link rel="stylesheet" href="style.css">
    <!-- 引入第三方 confetti 库 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <main id="swup" class="container transition-fade">
        <!-- 统一的返回导航 -->
        <nav class="top-nav">
            <a href="../../index.html" class="btn-back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                返回首页
            </a>
        </nav>

        <div class="tool-content">
            <header class="app-header">
                <h1>解压敲击</h1>
                <p>点击头像，释放压力，获取随机赞美与彩带反馈</p>
            </header>

            <div class="avatar-container">
                <img id="avatar" class="avatar" src="avatar_cqy.jpg" alt="头像">
                <audio id="sound" src="click.mp3" preload="auto"></audio>
            </div>
        </div>
    </main>

    <!-- 引入专属逻辑与动态特效脚本 -->
    <script src="script.js"></script>
    <script src="https://unpkg.com/swup@4"></script>
    <script src="https://unpkg.com/@swup/scripts-plugin@3"></script>
    <script src="https://unpkg.com/@swup/preload-plugin@3"></script>
    <script src="../../assets/js/effects.js"></script>
</body>
</html>
